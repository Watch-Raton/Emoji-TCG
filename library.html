<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bibliothèque Emoji - Emoji TCG</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .library-page { max-width: 1280px; margin: 0 auto; padding: 2rem 1rem 3rem; }
      .library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.8rem; }
      .library-card { display: flex; flex-direction: column; gap: 0.45rem; padding: 0.9rem; border-radius: 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); transition: transform 160ms ease, border-color 160ms ease, background 160ms ease; }
      .library-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.18); background: rgba(255,255,255,0.08); }
      .library-card.is-discovered { border-color: rgba(74, 222, 128, 0.38); box-shadow: inset 0 0 0 1px rgba(74, 222, 128, 0.18); }
      .library-card .card-top { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
      .library-card .emoji { font-size: 1.9rem; line-height: 1; }
      .library-card .status-pill { display: inline-flex; align-items: center; justify-content: center; padding: 0.24rem 0.5rem; border-radius: 999px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; background: rgba(255,255,255,0.08); color: var(--muted); }
      .library-card.is-discovered .status-pill { background: rgba(74, 222, 128, 0.16); color: #86efac; }
      .library-card .name { display: block; font-weight: 700; font-size: 0.95rem; line-height: 1.25; word-break: break-word; min-height: 2.45rem; }
      .library-card .family-pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 0.25rem 0.55rem; width: fit-content; background: rgba(255,255,255,0.08); color: var(--muted); font-size: 0.74rem; }
      .library-card .rate { display: inline-flex; align-items: center; width: fit-content; padding: 0.28rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
      .library-header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; }
      .library-toolbar { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1rem; }
      .library-toolbar input { flex: 1; min-width: 220px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.06); color: var(--text); padding: 0.8rem 0.95rem; border-radius: 999px; }
      .library-toolbar button { border: 0; padding: 0.8rem 1rem; border-radius: 999px; background: rgba(255,255,255,0.1); color: white; cursor: pointer; }
      .library-toolbar button.is-active { background: linear-gradient(135deg, rgba(129,140,248,0.85), rgba(236,72,153,0.75)); }
      .library-stats { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.7rem; }
      .stat-pill { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.45rem 0.75rem; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: var(--text); font-size: 0.92rem; }
      .library-family-section { margin-bottom: 1.2rem; }
      .family-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.7rem; padding-bottom: 0.35rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
      .family-header h3 { margin: 0; font-size: 1.05rem; }
      .family-count { color: var(--muted); font-size: 0.9rem; }
      @media (max-width: 760px) { .library-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); } }
    </style>
  </head>
  <body>
    <main class="library-page">
      <div class="library-header">
        <div>
          <p class="eyebrow">Emoji TCG</p>
          <h1>Bibliothèque complète</h1>
          <p class="subtitle">Consulte l’intégralité des emojis disponibles et leur taux d’obtention par rareté.</p>
          <div class="library-stats">
            <span class="stat-pill">Découverts : <strong id="discoveredCount">0</strong>/<strong id="totalCount">0</strong></span>
            <span class="stat-pill">Résultats : <strong id="resultsCount">0</strong></span>
            <span class="stat-pill">Pièces : <strong id="coinsCount">0</strong> 🪙</span>
          </div>
        </div>
        <a href="index.html" class="primary-btn" style="text-decoration:none; display:inline-flex; align-items:center;">Retour au jeu</a>
      </div>

      <div class="library-toolbar">
        <input id="librarySearch" type="text" placeholder="Rechercher un emoji..." />
        <button id="filterAllBtn" class="is-active">Tous</button>
        <button id="filterCollectedBtn">Obtenus</button>
        <button id="filterMissingBtn">À obtenir</button>
        <button id="sortRateBtn">Trier par taux ↓</button>
      </div>

      <div id="libraryGrid" class="library-grid"></div>
    </main>

    <script src="emoji-data.js?v=20260806"></script>
    <script>
      const libraryGrid = document.getElementById('libraryGrid');
      const searchInput = document.getElementById('librarySearch');
      const sortRateBtn = document.getElementById('sortRateBtn');
      const filterAllBtn = document.getElementById('filterAllBtn');
      const filterCollectedBtn = document.getElementById('filterCollectedBtn');
      const filterMissingBtn = document.getElementById('filterMissingBtn');
      const discoveredCountEl = document.getElementById('discoveredCount');
      const totalCountEl = document.getElementById('totalCount');
      const resultsCountEl = document.getElementById('resultsCount');
      const coinsCountEl = document.getElementById('coinsCount');
      const library = Array.isArray(window.EmojiTCGData?.EMOJI_LIBRARY) ? window.EmojiTCGData.EMOJI_LIBRARY : [];
      const { getRarityByName, getRarityRank: sharedGetRarityRank, translateEmojiName } = window.EmojiTCGData || {};
      const storageKey = 'emoji-tcg-save-v1';
      let sortAscending = false;
      let activeFilter = 'all';

      function getDisplayName(item) {
        if (!item) {
          return '';
        }

        const rawName = item.displayName || item.frenchName || item.localizedName || item.name || item.symbol || '';
        if (typeof rawName !== 'string' || !rawName.trim()) {
          return item.symbol || '';
        }

        if (typeof translateEmojiName === 'function') {
          return translateEmojiName(rawName);
        }

        return rawName;
      }

      function getRarityRankValue(rarityName) {
        if (sharedGetRarityRank) {
          return sharedGetRarityRank(rarityName);
        }
        const ranks = {
          Légendaire: 0,
          Épique: 1,
          Rare: 2,
          'Peu commun': 3,
          Commun: 4
        };
        return ranks[rarityName] ?? 5;
      }

      function getCollectionState() {
        const saved = localStorage.getItem(storageKey);
        const parsed = saved ? JSON.parse(saved) : { collection: {} };
        return parsed.collection || {};
      }

      function isCollectedItem(item, collection) {
        const normalizedName = (item.name || '').toLowerCase();
        const normalizedSymbol = (item.symbol || '').toLowerCase();
        const candidates = [
          `${normalizedName}:${normalizedSymbol}`,
          `${(item.key || '').toLowerCase()}`,
          normalizedSymbol,
          normalizedName
        ];

        return Object.values(collection).some((entry) => {
          const entryName = (entry.name || '').toLowerCase();
          const entrySymbol = (entry.symbol || '').toLowerCase();
          const entryKey = (entry.key || '').toLowerCase();
          return candidates.some((candidate) => candidate && [entryName, entrySymbol, entryKey].includes(candidate));
        });
      }

      const FAMILY_NAME_MAP = {
        'Smileys & Emotion': 'Émotions',
        'People & Body': 'Personnes & corps',
        'Animals & Nature': 'Animaux et nature',
        'Food & Drink': 'Nourriture et boisson',
        'Travel & Places': 'Voyage et lieux',
        Activities: 'Activités',
        Objects: 'Objets',
        Symbols: 'Symboles',
        Flags: 'Drapeaux'
      };

      function getFamilyLabel(group) {
        if (!group) {
          return 'Autres';
        }
        return FAMILY_NAME_MAP[group] || group || 'Autres';
      }

      function getFamilyForItem(item) {
        return getFamilyLabel(item.family || item.group);
      }

      function getFamilyForCollectionEntry(entry) {
        const group = entry.family || entry.group;
        if (group) {
          return getFamilyLabel(group);
        }

        const name = (entry.name || entry.key || '').toLowerCase();
        const familyByName = {
          sourire: 'Émotions',
          cool: 'Émotions',
          robot: 'Personnes & corps',
          renard: 'Animaux et nature',
          dragon: 'Animaux et nature',
          licorne: 'Animaux et nature',
          poisson: 'Animaux et nature',
          papillon: 'Animaux et nature',
          'arc-en-ciel': 'Animaux et nature',
          trèfle: 'Animaux et nature',
          éclair: 'Animaux et nature',
          lune: 'Voyage et lieux',
          soleil: 'Voyage et lieux',
          planète: 'Voyage et lieux',
          fleur: 'Animaux et nature',
          océan: 'Animaux et nature',
          pizza: 'Nourriture et boisson',
          cupcake: 'Nourriture et boisson',
          fusée: 'Voyage et lieux',
          manette: 'Objets',
          musique: 'Objets',
          cible: 'Objets',
          diamant: 'Objets',
          soucoupe: 'Objets',
          puzzle: 'Objets',
          baguette: 'Objets',
          château: 'Objets',
          ballon: 'Objets'
        };
        return familyByName[name] || 'Autres';
      }

      function updateFilterButtons() {
        [filterAllBtn, filterCollectedBtn, filterMissingBtn].forEach((button) => button.classList.remove('is-active'));
        if (activeFilter === 'collected') {
          filterCollectedBtn.classList.add('is-active');
        } else if (activeFilter === 'missing') {
          filterMissingBtn.classList.add('is-active');
        } else {
          filterAllBtn.classList.add('is-active');
        }
      }

      function renderLibrary(filter = '') {
        if (!Array.isArray(library) || library.length === 0) {
          libraryGrid.innerHTML = '<div class="empty-state">La bibliothèque est indisponible pour le moment.</div>';
          resultsCountEl.textContent = '0';
          if (coinsCountEl) {
            coinsCountEl.textContent = '0';
          }
          return;
        }

        const term = filter.toLowerCase();
        const collection = getCollectionState();
        if (coinsCountEl) {
          const saved = localStorage.getItem(storageKey);
          const parsed = saved ? JSON.parse(saved) : {};
          coinsCountEl.textContent = Number(parsed.coins || 0);
        }
        const collectionEntries = Object.values(collection || {});
        const discoveredByFamily = new Map();

        collectionEntries.forEach((entry) => {
          const family = getFamilyForCollectionEntry(entry);
          discoveredByFamily.set(family, (discoveredByFamily.get(family) || 0) + 1);
        });

        const filtered = library.filter((item) => {
          const displayName = getDisplayName(item);
          const text = `${item.symbol} ${displayName} ${item.family || ''} ${item.rarity?.name || ''}`.toLowerCase();
          if (!text.includes(term)) {
            return false;
          }

          const discovered = isCollectedItem(item, collection);
          if (activeFilter === 'collected') {
            return discovered;
          }
          if (activeFilter === 'missing') {
            return !discovered;
          }
          return true;
        });

        const grouped = filtered.reduce((acc, item) => {
          const family = getFamilyForItem(item);
          if (!acc.has(family)) {
            acc.set(family, []);
          }
          acc.get(family).push(item);
          return acc;
        }, new Map());

        const familyOrder = ['Émotions', 'Personnes & corps', 'Animaux et nature', 'Nourriture et boisson', 'Voyage et lieux', 'Activités', 'Objets', 'Symboles', 'Drapeaux', 'Autres'];
        const families = [...grouped.entries()].sort((a, b) => {
          const indexA = familyOrder.indexOf(a[0]);
          const indexB = familyOrder.indexOf(b[0]);
          const baseDiff = (indexA === -1 ? 999 : indexA) - (indexB === -1 ? 999 : indexB);
          if (baseDiff !== 0) {
            return baseDiff;
          }
          return a[0].localeCompare(b[0]);
        });

        libraryGrid.innerHTML = '';
        resultsCountEl.textContent = filtered.length;

        families.forEach(([family, items]) => {
          const sorted = [...items].sort((a, b) => {
            const rankDiff = getRarityRankValue(a.rarity.name) - getRarityRankValue(b.rarity.name);
            if (rankDiff !== 0) {
              return rankDiff;
            }
            if (sortAscending) {
              return a.rate - b.rate;
            }
            return b.rate - a.rate;
          });

          const section = document.createElement('section');
          section.className = 'library-family-section';
          const totalInFamily = sorted.length;
          const discoveredInFamily = discoveredByFamily.get(family) || 0;
          section.innerHTML = `
            <div class="family-header">
              <h3>${family}</h3>
              <span class="family-count">Découverts : ${discoveredInFamily}/${totalInFamily}</span>
            </div>
          `;
          const familyGrid = document.createElement('div');
          familyGrid.className = 'library-grid';
          sorted.forEach((item) => {
            const card = document.createElement('article');
            const discovered = isCollectedItem(item, collection);
            card.className = `library-card${discovered ? ' is-discovered' : ''}`;
            const rarity = getRarityByName ? getRarityByName(item.rarity.name) : item.rarity;
            card.innerHTML = `
              <div class="card-top">
                <div class="emoji">${item.symbol}</div>
                <span class="status-pill">${discovered ? 'Obtenu' : 'À obtenir'}</span>
              </div>
              <span class="name">${getDisplayName(item)}</span>
              <span class="family-pill">${getFamilyForItem(item)}</span>
              <span class="rate" style="background:${rarity.color}22; color:${rarity.color};">${rarity.name} · ${item.rate}%</span>
            `;
            familyGrid.appendChild(card);
          });
          section.appendChild(familyGrid);
          libraryGrid.appendChild(section);
        });
      }

      function updateDiscoveryCount() {
        const collection = getCollectionState();
        const discovered = Object.values(collection).filter((entry) => (entry.count || 0) > 0).length;
        discoveredCountEl.textContent = discovered;
        totalCountEl.textContent = library.length;
      }

      searchInput.addEventListener('input', (event) => renderLibrary(event.target.value));
      sortRateBtn.addEventListener('click', () => {
        sortAscending = !sortAscending;
        sortRateBtn.textContent = sortAscending ? 'Trier par taux ↑' : 'Trier par taux ↓';
        renderLibrary(searchInput.value);
      });
      filterAllBtn.addEventListener('click', () => {
        activeFilter = 'all';
        updateFilterButtons();
        renderLibrary(searchInput.value);
      });
      filterCollectedBtn.addEventListener('click', () => {
        activeFilter = 'collected';
        updateFilterButtons();
        renderLibrary(searchInput.value);
      });
      filterMissingBtn.addEventListener('click', () => {
        activeFilter = 'missing';
        updateFilterButtons();
        renderLibrary(searchInput.value);
      });

      updateFilterButtons();
      updateDiscoveryCount();
      renderLibrary('');
    </script>
  </body>
</html>
