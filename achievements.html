<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Succès - Emoji TCG</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .achievements-page { max-width: 1080px; margin: 0 auto; padding: 2rem 1.2rem 3rem; }
      .achievements-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1.25rem; margin-bottom: 1.5rem; }
      .achievement-grid { display: grid; gap: 1rem; }
      .achievement-card { padding: 1rem 1.2rem; border-radius: 20px; background: rgba(16,28,50,0.92); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
      .achievement-card h3 { margin: 0 0 0.5rem; font-size: 1.05rem; }
      .achievement-card p { margin: 0 0 0.8rem; color: var(--muted); line-height: 1.5; }
      .achievement-meta { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
      .achievement-reward { color: #22c55e; font-weight: 700; }
      .achievement-progress { height: 0.8rem; width: 100%; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; margin-top: 0.8rem; }
      .achievement-progress-fill { display: block; height: 100%; border-radius: inherit; background: linear-gradient(135deg, #8b5cf6, #22c55e); width: 0%; transition: width 0.25s ease; }
      .achievement-status { font-size: 0.9rem; font-weight: 700; }
      .achievement-claim-btn { margin-top: 0.85rem; padding: 0.75rem 1rem; border-radius: 999px; border: 1px solid rgba(255,255,255,0.14); background: rgba(255,255,255,0.06); color: var(--text); cursor: pointer; font-weight: 700; transition: transform 0.15s ease, background 0.15s ease; }
      .achievement-claim-btn:hover { transform: translateY(-1px); background: rgba(255,255,255,0.12); }
      .achievement-card.pending { border-color: rgba(234, 179, 8, 0.7); background: rgba(234, 179, 8, 0.08); }
      .achievement-card.claimed { border-color: rgba(34, 197, 94, 0.7); background: rgba(34, 197, 94, 0.08); }
      .achievement-card.claimed .achievement-status { color: #22c55e; }
      .achievement-card.unlocked { border-color: rgba(34, 197, 94, 0.7); background: rgba(34, 197, 94, 0.08); }
      .achievement-milestones { position: relative; width: 100%; margin-top: 0.75rem; font-size:1.05rem; min-height: 5rem; }
      .achievement-milestones .milestone { position: absolute; top: 0; transform: translateX(-50%); display:inline-flex; align-items:center; justify-content:center; width:2.6rem; height:2.6rem; border-radius:999px; background: rgba(255,255,255,0.08); color: var(--text); filter: grayscale(1); opacity: 0.35; transition: all 0.25s ease; }
      .achievement-milestones .milestone:nth-child(1) { left: 25%; }
      .achievement-milestones .milestone:nth-child(2) { left: 50%; }
      .achievement-milestones .milestone:nth-child(3) { left: 75%; }
      .achievement-milestones .milestone:nth-child(4) { left: 100%; }
      .achievement-milestones .milestone::before { content: ''; position: absolute; top: -0.45rem; left: 50%; transform: translateX(-50%); width: 0.2rem; height: 0.75rem; border-radius: 999px; background: rgba(255,255,255,0.7); }
      .achievement-milestones .milestone::after { content: attr(data-threshold) '%'; position: absolute; top: 3rem; left: 50%; transform: translateX(-50%); font-size: 0.75rem; color: rgba(255,255,255,0.7); }
      .achievement-milestones .milestone.activated { filter: grayscale(0); opacity:1; background: rgba(34,197,94,0.14); color: #22c55e; }
      .achievement-milestones .milestone.activated::before { background: rgba(34,197,94,0.9); }
      .achievement-milestones .milestone.activated::after { content: '✓'; position: absolute; right: -0.2rem; bottom: -0.2rem; width: 1rem; height: 1rem; border-radius: 999px; background: #22c55e; color: white; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; border: 1px solid rgba(255,255,255,0.3); }
    </style>
  </head>
  <body>
    <main class="app-shell achievements-page">
      <header class="hero page-hero achievements-header">
        <div>
          <p class="eyebrow">Emoji TCG</p>
          <h1>Succès</h1>
          <p class="subtitle">Découvre des succès amusants et gagne des pièces en accomplissant des défis difficiles.</p>
          <p id="achievementSummary" class="subtitle" style="margin-top:0.75rem;">0 succès débloqués</p>
          <div class="global-achievement-progress" style="margin-top:0.75rem;">
            <div class="progress-labels" style="display:flex; justify-content:space-between; gap:1rem; align-items:center; margin-bottom:0.5rem;">
              <span id="achievementCounter">0/0 succès</span>
              <span id="achievementPercent">0%</span>
            </div>
            <div class="achievement-progress global">
              <span id="achievementGlobalFill" class="achievement-progress-fill" style="width:0%;"></span>
            </div>
            <div class="achievement-milestones" style="display:flex; justify-content:space-between; gap:0.5rem; margin-top:0.5rem; font-size:1.05rem;">
              <span class="milestone" data-threshold="25">🥉</span>
              <span class="milestone" data-threshold="50">🥈</span>
              <span class="milestone" data-threshold="75">🥇</span>
              <span class="milestone" data-threshold="100">🏅</span>
            </div>
          </div>
          <p id="pendingAchievementCount" class="subtitle" style="margin-top:0.75rem;">0 récompense en attente</p>
          <span id="coinsCount" class="stat-pill" style="margin-top:0.4rem;">0 🪙</span>
        </div>
        <a href="index.html" class="primary-btn" style="text-decoration:none; display:inline-flex; align-items:center;">Retour au jeu</a>
      </header>
      <div id="achievementGrid" class="achievement-grid"></div>
    </main>

    <script src="emoji-data.js"></script>
    <script src="achievements.js"></script>
    <script src="background.js"></script>
    <script>
      const achievementGrid = document.getElementById('achievementGrid');
      const coinsCountEl = document.getElementById('coinsCount');
      const STORAGE_KEY = 'emoji-tcg-save-v1';

      function loadState() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return { achievementsUnlocked: {}, achievementsClaimed: {}, coins: 0, maxCoinsHeld: 0, collection: {}, boostersOpened: 0, followedTwitch: false, followedInstagram: false, ownedBackgrounds: [], currentBackground: null, duplicatesSold: 0, shopItemsPurchased: 0, totalCoinsEarned: 0, totalCoinsSpent: 0, totalCosmeticsObtained: 0 };
        }
        try {
          const parsed = JSON.parse(raw);
          return {
            achievementsUnlocked: typeof parsed.achievementsUnlocked === 'object' ? parsed.achievementsUnlocked : {},
            achievementsClaimed: typeof parsed.achievementsClaimed === 'object' ? parsed.achievementsClaimed : {},
            coins: Number(parsed.coins || 0),
            maxCoinsHeld: Number(parsed.maxCoinsHeld || 0),
            collection: parsed.collection || {},
            boostersOpened: Number(parsed.boostersOpened || 0),
            followedTwitch: Boolean(parsed.followedTwitch),
            followedInstagram: Boolean(parsed.followedInstagram),
            duplicatesSold: Number(parsed.duplicatesSold || 0),
            shopItemsPurchased: Number(parsed.shopItemsPurchased || 0),
            totalCoinsEarned: Number(parsed.totalCoinsEarned || 0),
            totalCoinsSpent: Number(parsed.totalCoinsSpent || 0),
            totalCosmeticsObtained: Number(parsed.totalCosmeticsObtained || 0),
            ownedBackgrounds: Array.isArray(parsed.ownedBackgrounds) ? parsed.ownedBackgrounds : [],
            currentBackground: parsed.currentBackground ?? null
          };
        } catch {
          return { achievementsUnlocked: {}, achievementsClaimed: {}, coins: 0, maxCoinsHeld: 0, collection: {}, boostersOpened: 0, followedTwitch: false, followedInstagram: false, duplicatesSold: 0, shopItemsPurchased: 0, totalCoinsEarned: 0, totalCoinsSpent: 0, totalCosmeticsObtained: 0 };
        }
      }

      function saveState(state) {
        const raw = localStorage.getItem(STORAGE_KEY);
        const current = raw ? JSON.parse(raw) : {};
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          ...current,
          achievementsUnlocked: state.achievementsUnlocked,
          achievementsClaimed: state.achievementsClaimed,
          coins: state.coins,
          maxCoinsHeld: state.maxCoinsHeld,
          totalCoinsEarned: Number(state.totalCoinsEarned || current.totalCoinsEarned || 0),
          totalCoinsSpent: Number(state.totalCoinsSpent || current.totalCoinsSpent || 0),
          totalCosmeticsObtained: Number(state.totalCosmeticsObtained || current.totalCosmeticsObtained || 0)
        }));
      }

      function updatePendingAchievementCount(state) {
        const pendingCount = getPendingAchievementCount(state);
        const pendingCountElement = document.getElementById('pendingAchievementCount');
        if (pendingCountElement) {
          pendingCountElement.textContent = `${pendingCount} récompense${pendingCount === 1 ? '' : 's'} en attente`;
        }
      }

      function getPendingAchievementCount(state) {
        if (!Array.isArray(ACHIEVEMENT_DEFINITIONS)) {
          return 0;
        }
        return ACHIEVEMENT_DEFINITIONS.reduce((count, definition) => {
          const unlocked = state.achievementsUnlocked?.[definition.id];
          const claimed = state.achievementsClaimed?.[definition.id];
          return count + ((unlocked && !claimed) ? 1 : 0);
        }, 0);
      }

      function getAchievementCompletionCount(state) {
        if (!Array.isArray(ACHIEVEMENT_DEFINITIONS)) {
          return 0;
        }
        return ACHIEVEMENT_DEFINITIONS.reduce((count, definition) => count + (Boolean(state.achievementsUnlocked?.[definition.id]) ? 1 : 0), 0);
      }

      function getAchievementGlobalPercent(state) {
        if (!Array.isArray(ACHIEVEMENT_DEFINITIONS) || ACHIEVEMENT_DEFINITIONS.length === 0) {
          return 0;
        }
        return Math.floor((getAchievementCompletionCount(state) / ACHIEVEMENT_DEFINITIONS.length) * 100);
      }

      function renderAchievementOverview(state) {
        const total = Array.isArray(ACHIEVEMENT_DEFINITIONS) ? ACHIEVEMENT_DEFINITIONS.length : 0;
        const completed = getAchievementCompletionCount(state);
        const percent = getAchievementGlobalPercent(state);
        const counterEl = document.getElementById('achievementCounter');
        const percentEl = document.getElementById('achievementPercent');
        const summaryEl = document.getElementById('achievementSummary');
        const fillEl = document.getElementById('achievementGlobalFill');

        if (counterEl) {
          counterEl.textContent = `${completed}/${total} succès`;
        }
        if (percentEl) {
          percentEl.textContent = `${percent}%`;
        }
        if (summaryEl) {
          summaryEl.textContent = `${completed} succès débloqués sur ${total}`;
        }
        if (fillEl) {
          fillEl.style.width = `${Math.max(0, Math.min(100, percent))}%`;
        }

        document.querySelectorAll('.achievement-milestones .milestone').forEach((node) => {
          const threshold = Number(node.dataset.threshold || 0);
          if (threshold <= percent) {
            node.classList.add('activated');
          } else {
            node.classList.remove('activated');
          }
        });
      }

      function claimAchievement(definition, state) {
        if (!state.achievementsUnlocked?.[definition.id] || state.achievementsClaimed?.[definition.id]) {
          return;
        }

        state.achievementsClaimed = {
          ...(state.achievementsClaimed || {}),
          [definition.id]: true
        };
        const rewardValue = Number(definition.reward || 0);
        state.coins = Number(state.coins || 0) + rewardValue;
        state.totalCoinsEarned = (state.totalCoinsEarned || 0) + rewardValue;
        state.maxCoinsHeld = Math.max(Number(state.maxCoinsHeld || 0), state.coins);
        saveState(state);
        updatePendingAchievementCount(state);
        renderAchievements();
      }

      function getAchievementCategoryRank(definition) {
        const id = definition.id || '';
        if (id.startsWith('booster-')) return 1;
        if (id.startsWith('shop-buy-')) return 2;
        if (id.startsWith('duplicates-')) return 3;
        if (id.startsWith('legendary-')) return 4;
        if (id.startsWith('coins-')) return 5;
        if (id.startsWith('cosmetics-')) return 6;
        if (id.startsWith('follow-')) return 7;
        if (id === 'all-families' || id === 'all-emojis') return 8;
        if (id === 'raccoon-hunter') return 9;
        return 10;
      }

      function renderAchievements() {
        const state = loadState();
        achievementGrid.innerHTML = '';

        if (!Array.isArray(ACHIEVEMENT_DEFINITIONS) || ACHIEVEMENT_DEFINITIONS.length === 0) {
          achievementGrid.innerHTML = '<p class="subtitle">Aucun succès disponible pour le moment.</p>';
          return;
        }

        if (coinsCountEl) {
          coinsCountEl.textContent = `${Number(state.coins || 0)} 🪙`;
        }

        updatePendingAchievementCount(state);

        const sortedAchievements = [...ACHIEVEMENT_DEFINITIONS].sort((a, b) => {
          const rankDiff = getAchievementCategoryRank(a) - getAchievementCategoryRank(b);
          if (rankDiff !== 0) {
            return rankDiff;
          }
          if (a.reward !== b.reward) {
            return a.reward - b.reward;
          }
          return a.name.localeCompare(b.name, 'fr', { sensitivity: 'base' });
        });

        sortedAchievements.forEach((definition) => {
          const current = getAchievementProgress(definition, state);
          const target = getAchievementTarget(definition);
          const unlocked = Boolean(state.achievementsUnlocked?.[definition.id]);
          const claimed = Boolean(state.achievementsClaimed?.[definition.id]);
          const completed = current >= target;
          const progress = target ? Math.min(100, Math.floor((current / target) * 100)) : 0;
          let statusText = `${formatAchievementProgress(definition, state)}`;
          let cardClass = 'achievement-card';
          let actionHtml = '';
          const rewardText = definition.reward > 0 ? `+${definition.reward} 🪙` : 'Fond d’écran';

          if (unlocked && !claimed && definition.reward > 0) {
            statusText = 'À réclamer';
            cardClass += ' pending';
            actionHtml = `<button class="achievement-claim-btn" data-achievement-id="${definition.id}">Réclamer</button>`;
          } else if (claimed) {
            statusText = 'Réclamé';
            cardClass += ' claimed';
          } else if (completed) {
            statusText = 'Succès débloqué';
            cardClass += ' unlocked';
          }

          const card = document.createElement('article');
          card.className = cardClass;
          card.innerHTML = `
            <h3>${definition.name}</h3>
            <p>${definition.description}</p>
            <div class="achievement-meta">
              <span class="achievement-reward">${rewardText}</span>
              <span class="achievement-status">${statusText}</span>
            </div>
            <div class="achievement-progress">
              <span class="achievement-progress-fill" style="width: ${progress}%"></span>
            </div>
            ${actionHtml}
          `;
          achievementGrid.appendChild(card);
        });

        achievementGrid.querySelectorAll('.achievement-claim-btn').forEach((button) => {
          button.addEventListener('click', () => {
            const achievementId = button.dataset.achievementId;
            const definition = ACHIEVEMENT_DEFINITIONS.find((item) => item.id === achievementId);
            if (definition) {
              claimAchievement(definition, state);
            }
          });
        });

        renderAchievementOverview(state);
      }

      renderAchievements();
    </script>
  </body>
</html>
