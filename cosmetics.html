<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cosmétiques - Emoji TCG</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .cosmetics-page { max-width: 1080px; margin: 0 auto; padding: 2rem 1rem 3rem; }
      .cosmetics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.9rem; }
      .cosmetic-card { padding: 0.9rem; border-radius: 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); display:flex; flex-direction:column; align-items:center; gap:0.5rem; }
      .cosmetic-card.locked { opacity: 0.8; }
      .cosmetic-card .emoji { font-size: 2.5rem; }
      .cosmetic-card .meta { margin-top:0.25rem; }
      .primary-action { padding:0.6rem 1rem; border-radius:999px; background:linear-gradient(135deg,#8b5cf6,#22c55e); color:white; border:0; cursor:pointer; font-weight:700; }
    </style>
  </head>
  <body>
    <main class="cosmetics-page">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:1rem; margin-bottom:1rem;">
        <div>
          <p class="eyebrow">Emoji TCG</p>
          <h1>Cosmétiques</h1>
          <p class="subtitle">Change le fond du site avec des fonds écrans emojis. Débloque-en via le coffre cosmétique.</p>
        </div>
        <div style="text-align:right">
          <div id="cosmeticsCoins" class="stat-pill">0 🪙</div>
          <a href="index.html" class="primary-btn" style="display:inline-block; margin-top:0.5rem; text-decoration:none;">Retour au jeu</a>
        </div>
      </div>

      <div style="margin-bottom:1rem; display:flex; gap:0.75rem; align-items:center;">
        <button id="resetBackgroundBtn" class="secondary-btn">Revenir au fond par défaut</button>
      </div>

      <div id="cosmeticsGrid" class="cosmetics-grid"></div>
    </main>

    <script src="emoji-data.js"></script>
    <script src="app.js"></script>
    <script>
      const resetBtn = document.getElementById('resetBackgroundBtn');
      resetBtn?.addEventListener('click', () => {
        state.currentBackground = null;
        saveState();
        applyBackground(null);
        renderCosmetics();
      });

      // Initial render
      renderCosmetics();
    </script>
  </body>
</html>
