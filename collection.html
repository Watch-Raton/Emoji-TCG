<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collection - Emoji TCG</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .collection-page { max-width: 1120px; margin: 0 auto; padding: 2rem 1rem 3rem; }
      .library-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1.25rem; margin-bottom: 1.5rem; }
      .collection-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.9rem; }
      .collection-card { padding: 0.9rem; border-radius: 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); }
      .collection-stats { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.7rem; }
      .stat-pill { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.45rem 0.75rem; border-radius: 999px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: var(--text); font-size: 0.92rem; }
      .collection-card .emoji { font-size: 2rem; }
      .collection-card .name { display: block; font-weight: 700; margin-top: 0.35rem; }
      .collection-card .meta { margin-top: 0.35rem; color: var(--muted); font-size: 0.92rem; }
      .exchange-btn { margin-top: 0.8rem; border: 0; padding: 0.55rem 0.8rem; border-radius: 999px; background: rgba(250, 204, 21, 0.18); color: #facc15; font-weight: 700; cursor: pointer; }
      .exchange-btn:hover { filter: brightness(1.08); }
    </style>
  </head>
  <body>
    <main class="collection-page">
      <div class="library-header">
        <div>
          <p class="eyebrow">Emoji TCG</p>
          <h1>Collection</h1>
          <p class="subtitle">Consulte tous les emojis que tu as obtenus, avec la couleur de rareté associée.</p>
          <div class="collection-stats">
            <span class="stat-pill">Découverts : <strong id="discoveredCount">0</strong>/<strong id="totalCount">0</strong></span>
          </div>
        </div>
        <a href="index.html" class="primary-btn" style="text-decoration:none; display:inline-flex; align-items:center; margin-left: 1rem;">Retour au jeu</a>
      </div>
      <div id="collectionGrid" class="collection-grid"></div>
    </main>

    <script src="emoji-data.js"></script>
    <script>
      const storageKey = 'emoji-tcg-save-v1';
      const collectionGrid = document.getElementById('collectionGrid');
      const discoveredCountEl = document.getElementById('discoveredCount');
      const totalCountEl = document.getElementById('totalCount');
      const { getRarityByName, getRarityRank, EMOJI_LIBRARY = [] } = window.EmojiTCGData || {};
      const libraryBySymbol = new Map(EMOJI_LIBRARY.map((emoji) => [emoji.symbol, emoji]));

      const normalizeCollectionEntry = (entry) => {
        if (!entry) {
          return entry;
        }
        const matchingEmoji = libraryBySymbol.get(entry.symbol) || EMOJI_LIBRARY.find((emoji) => emoji.name === entry.name || `${emoji.name}-${emoji.symbol}` === entry.key);
        if (!matchingEmoji) {
          return entry;
        }
        return {
          ...entry,
          name: matchingEmoji.name,
          rarity: matchingEmoji.rarity?.name || entry.rarity,
          symbol: matchingEmoji.symbol,
          family: matchingEmoji.family || entry.family,
          group: matchingEmoji.group || entry.group
        };
      };

      const loadState = () => {
        const raw = localStorage.getItem(storageKey);
        const parsed = raw ? JSON.parse(raw) : { collection: {} };
        return {
          ...parsed,
          collection: Object.fromEntries(Object.entries(parsed.collection || {}).map(([key, entry]) => [key, normalizeCollectionEntry(entry)])),
          exchangeBoosterCredits: Number(parsed.exchangeBoosterCredits || 0)
        };
      };

      const saveState = (state) => {
        localStorage.setItem(storageKey, JSON.stringify(state));
      };

      const state = loadState();

      const renderCollection = () => {
        const entries = Object.values(state.collection || {}).sort((a, b) => {
          const rankDiff = (getRarityRank ? getRarityRank(a.rarity) : 5) - (getRarityRank ? getRarityRank(b.rarity) : 5);
          if (rankDiff !== 0) {
            return rankDiff;
          }
          return b.count - a.count;
        });
        const discovered = Object.values(state.collection || {}).filter((entry) => (entry.count || 0) > 0).length;
        discoveredCountEl.textContent = discovered;
        totalCountEl.textContent = EMOJI_LIBRARY.length;

        if (entries.length) {
          collectionGrid.innerHTML = '';
          entries.forEach((entry) => {
            const rarity = getRarityByName ? getRarityByName(entry.rarity) : { name: entry.rarity, color: '#60a5fa' };
            const color = rarity.color || '#60a5fa';
            const card = document.createElement('article');
            card.className = 'collection-card';
            card.style.borderColor = `${color}55`;
            card.innerHTML = `
              <div class="emoji">${entry.symbol}</div>
              <span class="name">${entry.name || entry.key || ''}</span>
              <div class="meta">x${entry.count} · <span style="color:${color}; font-weight:700;">${rarity.name}</span></div>
            `;

            if ((entry.count || 0) >= 5) {
              const actionButton = document.createElement('button');
              actionButton.className = 'exchange-btn';
              actionButton.textContent = 'Échanger 5 contre 1 booster';
              actionButton.addEventListener('click', () => {
                const currentEntry = state.collection[entry.key];
                if (!currentEntry || (currentEntry.count || 0) < 5) {
                  return;
                }
                const nextCount = (currentEntry.count || 0) - 5;
                if (nextCount <= 0) {
                  delete state.collection[entry.key];
                } else {
                  currentEntry.count = nextCount;
                }
                state.exchangeBoosterCredits = (state.exchangeBoosterCredits || 0) + 1;
                saveState(state);
                renderCollection();
              });
              card.appendChild(actionButton);
            }

            collectionGrid.appendChild(card);
          });
        } else {
          collectionGrid.innerHTML = '<div class="empty-state">Aucune carte dans la collection pour le moment.</div>';
        }
      };

      renderCollection();
    </script>
  </body>
</html>
